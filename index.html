<!doctype html>
<!-- translate="no": 브라우저 자동 번역(Edge/Chrome)이 React가 관리하는 텍스트
     노드를 <font>로 감싸 DOM을 변조하면 리포트 생성 등 큰 서브트리 교체 시
     removeChild NotFoundError로 흰 화면이 난다. 자체 5개 언어 선택기가 있으므로
     브라우저 번역은 차단한다. -->
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <meta name="color-scheme" content="light dark" />
    <title>MASIL · Senior MASIL Zone Insurance Design</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%230B63F6' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%230B63F6'/%3E%3C/svg%3E" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <script>
      // Set the theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem("masil-theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/react-demo/main.tsx"></script>
  </body>
</html>
