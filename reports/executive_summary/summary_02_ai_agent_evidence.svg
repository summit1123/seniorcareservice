<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#2563EB"/></marker>
</defs>
<rect width="1920" height="1080" fill="#F7F9FC"/>
<text x="80" y="70" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#2563EB" text-anchor="start">Executive Summary 02</text><text x="80" y="132" font-family="Inter, Arial, Helvetica, sans-serif" font-size="48" font-weight="820" fill="#14213D" text-anchor="start">AI agents search the product rule before rollout</text><text x="82" y="180" font-family="Inter, Arial, Helvetica, sans-serif" font-size="27" font-weight="450" fill="#4B5563" text-anchor="start">The same customer data is evaluated under existing mileage logic and the proposed integrated score.</text><line x1="80" y1="218" x2="1840" y2="218" stroke="#D7DEE8" stroke-width="2"/><text x="1840" y="72" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#4B5563" text-anchor="end">AI Agent Loop</text><rect x="95" y="300" width="225" height="112" rx="24" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text x="207.5" y="348" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="780" fill="#14213D" text-anchor="middle">Persona</text><text x="207.5" y="382" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#4B5563" text-anchor="middle">senior types</text><path d="M325,356 L340,356" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="348" y="300" width="225" height="112" rx="24" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text x="460.5" y="348" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="780" fill="#14213D" text-anchor="middle">Scenario</text><text x="460.5" y="382" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#4B5563" text-anchor="middle">edge cases</text><path d="M578,356 L593,356" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="601" y="300" width="225" height="112" rx="24" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text x="713.5" y="348" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="780" fill="#14213D" text-anchor="middle">Simulation</text><text x="713.5" y="382" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#4B5563" text-anchor="middle">trip logs</text><path d="M831,356 L846,356" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="854" y="300" width="225" height="112" rx="24" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text x="966.5" y="348" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="780" fill="#14213D" text-anchor="middle">Consistency</text><text x="966.5" y="382" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#4B5563" text-anchor="middle">validation</text><path d="M1084,356 L1099,356" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1107" y="300" width="225" height="112" rx="24" fill="#E8F8F1" stroke="#059669" stroke-width="2"/><text x="1219.5" y="348" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="780" fill="#14213D" text-anchor="middle">Policy Search</text><text x="1219.5" y="382" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#4B5563" text-anchor="middle">weights</text><path d="M1337,356 L1352,356" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1360" y="300" width="225" height="112" rx="24" fill="#E8F8F1" stroke="#059669" stroke-width="2"/><text x="1472.5" y="348" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="780" fill="#14213D" text-anchor="middle">Evaluation</text><text x="1472.5" y="382" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#4B5563" text-anchor="middle">A/B test</text><path d="M1590,356 L1605,356" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1613" y="300" width="225" height="112" rx="24" fill="#FFF3E5" stroke="#EA7A24" stroke-width="2"/><text x="1725.5" y="348" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="780" fill="#14213D" text-anchor="middle">Critic + Report</text><text x="1725.5" y="382" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#4B5563" text-anchor="middle">XAI output</text><rect x="80" y="490" width="760" height="350" rx="30" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/><text x="120" y="550" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="800" fill="#14213D" text-anchor="start">What the agents actually do</text><text x="120" y="604" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="470" fill="#4B5563" text-anchor="start">1. Generate senior personas and difficult edge cases.</text><text x="120" y="646" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="470" fill="#4B5563" text-anchor="start">2. Build baseline vs. proposed driving scenarios.</text><text x="120" y="688" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="470" fill="#4B5563" text-anchor="start">3. Search weight and threshold candidates.</text><text x="120" y="730" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="470" fill="#4B5563" text-anchor="start">4. Produce reason codes; LLM rewrites reports only.</text><rect x="120" y="770" width="650" height="44" rx="14" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="1"/><text x="145" y="800" font-family="Inter, Arial, Helvetica, sans-serif" font-size="21" font-weight="650" fill="#14213D" text-anchor="start">Pricing boundary: deterministic local scoring engine, not free-form LLM judgment.</text><rect x="910" y="490" width="930" height="350" rx="30" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/><text x="950" y="550" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="800" fill="#14213D" text-anchor="start">Evidence from the latest run</text><rect x="950" y="590" width="195" height="118" rx="20" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text x="974" y="626" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#4B5563" text-anchor="start">Customers</text><text x="974" y="675" font-family="Inter, Arial, Helvetica, sans-serif" font-size="44" font-weight="850" fill="#2563EB" text-anchor="start">30</text><text x="974" y="686" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="450" fill="#4B5563" text-anchor="start">6 personas x 5</text><rect x="1170" y="590" width="210" height="118" rx="20" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text x="1194" y="626" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#4B5563" text-anchor="start">Trip logs</text><text x="1194" y="675" font-family="Inter, Arial, Helvetica, sans-serif" font-size="44" font-weight="850" fill="#2563EB" text-anchor="start">6,598</text><text x="1194" y="686" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="450" fill="#4B5563" text-anchor="start">12-month fixture</text><rect x="1405" y="590" width="190" height="118" rx="20" fill="#FFF3E5" stroke="#EA7A24" stroke-width="2"/><text x="1429" y="626" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#4B5563" text-anchor="start">False positives</text><text x="1429" y="675" font-family="Inter, Arial, Helvetica, sans-serif" font-size="44" font-weight="850" fill="#EA7A24" text-anchor="start">1</text><text x="1429" y="686" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="450" fill="#4B5563" text-anchor="start">limit &lt;= 3</text><rect x="1620" y="590" width="180" height="118" rx="20" fill="#E8F8F1" stroke="#059669" stroke-width="2"/><text x="1644" y="626" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#4B5563" text-anchor="start">False negatives</text><text x="1644" y="675" font-family="Inter, Arial, Helvetica, sans-serif" font-size="44" font-weight="850" fill="#059669" text-anchor="start">0</text><text x="1644" y="686" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="450" fill="#4B5563" text-anchor="start">risk-change set</text><rect x="950" y="740" width="850" height="66" rx="18" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="1"/><text x="975" y="782" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="750" fill="#14213D" text-anchor="start">Approval gate passed | Risk-change capture 5/5 | Baseline capture 0/5</text><rect x="80" y="890" width="1760" height="118" rx="30" fill="#101827"/><text x="120" y="940" font-family="Inter, Arial, Helvetica, sans-serif" font-size="27" font-weight="800" fill="#93C5FD" text-anchor="start">After the rule is selected</text><text x="120" y="984" font-family="Inter, Arial, Helvetica, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="start">Telematics -&gt; DBSCAN/P90 zone -&gt; 4 scores -&gt; decision -&gt; reason codes -&gt; staff report</text><text x="80" y="1040" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#4B5563" text-anchor="start">Governance: raw GPS/PII stay out of LLM calls; reports use privacy-filtered summary features and reason codes only.</text>
</svg>