<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2,2 L10,6 L2,10 Z" fill="#2563EB"/></marker>
</defs>
<rect width="1920" height="1080" fill="#F7F9FC"/>
<text x="80" y="70" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#2563EB" text-anchor="start">Executive Summary 01</text><text x="80" y="132" font-family="Inter, Arial, Helvetica, sans-serif" font-size="48" font-weight="820" fill="#14213D" text-anchor="start">Mileage-only discounts miss senior driving risk</text><text x="82" y="180" font-family="Inter, Arial, Helvetica, sans-serif" font-size="27" font-weight="450" fill="#4B5563" text-anchor="start">A safer product should evaluate how seniors drive within and beyond their familiar zone.</text><line x1="80" y1="218" x2="1840" y2="218" stroke="#D7DEE8" stroke-width="2"/><text x="1840" y="72" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#4B5563" text-anchor="end">Senior Safe Mileage</text><rect x="80" y="270" width="520" height="470" rx="30" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/><text x="118" y="328" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="780" fill="#14213D" text-anchor="start">Existing Mileage Discount</text><text x="118" y="370" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="450" fill="#4B5563" text-anchor="start">Single main signal: annualized mileage</text><rect x="118" y="410" width="444" height="86" rx="18" fill="#F3F4F6"/><text x="140" y="462" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="650" fill="#4B5563" text-anchor="start">Low annual mileage</text><text x="520" y="462" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="650" fill="#4B5563" text-anchor="end">Discount</text><text x="118" y="550" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="450" fill="#4B5563" text-anchor="start">Same low-mileage customers can still differ:</text><text x="118" y="586" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="450" fill="#4B5563" text-anchor="start">stable local driving, safe outside driving,</text><text x="118" y="622" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="450" fill="#4B5563" text-anchor="start">or sudden outside-zone risk change.</text><rect x="118" y="635" width="205" height="130" rx="20" fill="#FFF1F2" stroke="#C2410C" stroke-width="2"/><text x="142" y="671" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#4B5563" text-anchor="start">Risk-change capture</text><text x="142" y="720" font-family="Inter, Arial, Helvetica, sans-serif" font-size="44" font-weight="850" fill="#C2410C" text-anchor="start">0 / 5</text><text x="142" y="743" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="450" fill="#4B5563" text-anchor="start">baseline fixture</text><rect x="352" y="635" width="210" height="130" rx="20" fill="#FFF1F2" stroke="#C2410C" stroke-width="2"/><text x="376" y="671" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#4B5563" text-anchor="start">Decisions</text><text x="376" y="720" font-family="Inter, Arial, Helvetica, sans-serif" font-size="44" font-weight="850" fill="#C2410C" text-anchor="start">30</text><text x="376" y="743" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="450" fill="#4B5563" text-anchor="start">all discounted</text><rect x="680" y="270" width="1160" height="470" rx="30" fill="#FFFFFF" stroke="#D7DEE8" stroke-width="2"/><text x="718" y="328" font-family="Inter, Arial, Helvetica, sans-serif" font-size="31" font-weight="780" fill="#14213D" text-anchor="start">Proposed Integrated Senior Mileage Score</text><text x="718" y="370" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" font-weight="450" fill="#4B5563" text-anchor="start">Mileage is retained, then re-weighted with stability, safety, and pattern change.</text><rect x="720" y="420" width="240" height="118" rx="22" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text x="744" y="462" font-family="Inter, Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#4B5563" text-anchor="start">Mileage</text><text x="744" y="512" font-family="Inter, Arial, Helvetica, sans-serif" font-size="44" font-weight="850" fill="#2563EB" text-anchor="start">30%</text><rect x="990" y="420" width="240" height="118" rx="22" fill="#E8F8F1" stroke="#059669" stroke-width="2"/><text x="1014" y="462" font-family="Inter, Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#4B5563" text-anchor="start">In-Zone Safe</text><text x="1014" y="512" font-family="Inter, Arial, Helvetica, sans-serif" font-size="44" font-weight="850" fill="#059669" text-anchor="start">30%</text><rect x="1260" y="420" width="240" height="118" rx="22" fill="#FFF3E5" stroke="#EA7A24" stroke-width="2"/><text x="1284" y="462" font-family="Inter, Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#4B5563" text-anchor="start">Out-Zone Safe</text><text x="1284" y="512" font-family="Inter, Arial, Helvetica, sans-serif" font-size="44" font-weight="850" fill="#EA7A24" text-anchor="start">20%</text><rect x="1530" y="420" width="240" height="118" rx="22" fill="#FFF1F2" stroke="#C2410C" stroke-width="2"/><text x="1554" y="462" font-family="Inter, Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#4B5563" text-anchor="start">Pattern Change Risk</text><text x="1554" y="512" font-family="Inter, Arial, Helvetica, sans-serif" font-size="44" font-weight="850" fill="#C2410C" text-anchor="start">-20%</text><rect x="720" y="568" width="1050" height="70" rx="20" fill="#F8FAFC" stroke="#D7DEE8" stroke-width="2"/><text x="745" y="613" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#14213D" text-anchor="start">Final Score = Mileage + In-Zone Safety + Out-Zone Safety - Risk Pattern Change</text><rect x="720" y="662" width="240" height="125" rx="20" fill="#E8F8F1" stroke="#059669" stroke-width="2"/><text x="744" y="698" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#4B5563" text-anchor="start">Risk-change capture</text><text x="744" y="747" font-family="Inter, Arial, Helvetica, sans-serif" font-size="44" font-weight="850" fill="#059669" text-anchor="start">5 / 5</text><text x="744" y="765" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="450" fill="#4B5563" text-anchor="start">vs. 0 / 5 baseline</text><rect x="990" y="662" width="240" height="125" rx="20" fill="#FFF3E5" stroke="#EA7A24" stroke-width="2"/><text x="1014" y="698" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#4B5563" text-anchor="start">Care classification</text><text x="1014" y="747" font-family="Inter, Arial, Helvetica, sans-serif" font-size="44" font-weight="850" fill="#EA7A24" text-anchor="start">6</text><text x="1014" y="765" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="450" fill="#4B5563" text-anchor="start">preventive care</text><rect x="1260" y="662" width="240" height="125" rx="20" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text x="1284" y="698" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#4B5563" text-anchor="start">Preferred/standard</text><text x="1284" y="747" font-family="Inter, Arial, Helvetica, sans-serif" font-size="44" font-weight="850" fill="#2563EB" text-anchor="start">24</text><text x="1284" y="765" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="450" fill="#4B5563" text-anchor="start">16 favorable, 8 standard</text><rect x="1530" y="662" width="240" height="125" rx="20" fill="#E8F8F1" stroke="#059669" stroke-width="2"/><text x="1554" y="698" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" font-weight="650" fill="#4B5563" text-anchor="start">Gate pass rate</text><text x="1554" y="747" font-family="Inter, Arial, Helvetica, sans-serif" font-size="40" font-weight="850" fill="#059669" text-anchor="start">96.67%</text><text x="1554" y="765" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="450" fill="#4B5563" text-anchor="start">agent validation</text><rect x="80" y="820" width="1760" height="170" rx="30" fill="#101827"/><text x="120" y="872" font-family="Inter, Arial, Helvetica, sans-serif" font-size="27" font-weight="800" fill="#93C5FD" text-anchor="start">Core thesis</text><text x="120" y="928" font-family="Inter, Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" text-anchor="start">Not more benefits for seniors, but a fairer mileage formula for senior driving context.</text><text x="120" y="970" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="450" fill="#D1D5DB" text-anchor="start">The model detects unsafe behavior and sudden change inside or outside the familiar zone; it does not label every outside-zone trip as risky.</text><text x="80" y="1040" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#4B5563" text-anchor="start">Source: latest local fixture run, 30 customers / annual trips, selected policy policy_30_30_20_20_p20_a75</text>
</svg>