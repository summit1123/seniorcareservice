<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9FB2CC"/>
      <stop offset="1" stop-color="#8EA5C0"/>
    </linearGradient>
    <linearGradient id="hubFill" x1="0" y1="0" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF3FF"/>
      <stop offset="0.55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE8D6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#354B68" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#0B1B36" flood-opacity="0.14"/>
    </filter>
    <style>
      .font { font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", Arial, sans-serif; }
      .navy { fill: #111D3A; }
      .muted { fill: #64748B; }
      .white { fill: #FFFFFF; }
      .blue { fill: #0B63F6; }
      .orange { fill: #FF8B3D; }
      .lime { fill: #D8FF63; }
      .assetLabel { fill: #8A97AA; font-size: 13px; font-weight: 900; letter-spacing: 1.1px; }
      .sectionTitle { fill: #111D3A; font-size: 24px; font-weight: 900; letter-spacing: -0.6px; }
      .cardTitle { fill: #FFFFFF; font-size: 22px; font-weight: 900; letter-spacing: -0.6px; }
      .cardText { fill: #FFFFFF; font-size: 14px; font-weight: 800; letter-spacing: -0.25px; }
      .small { font-size: 12px; font-weight: 850; letter-spacing: -0.2px; }
      .pillText { font-size: 15px; font-weight: 900; letter-spacing: -0.3px; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#F6F8FC"/>
  <text class="font assetLabel" x="72" y="56">ASSET 01 · DATA INPUT STACK</text>
  <text class="font assetLabel" x="570" y="56">ASSET 02 · AGENT SIMULATION ENGINE</text>
  <text class="font assetLabel" x="1130" y="56">ASSET 03 · AI OUTPUT STACK</text>
  <text class="font assetLabel" x="152" y="545">ASSET 04 · WORKFLOW PIPELINE</text>
  <text class="font assetLabel" x="232" y="760">ASSET 05 · INSIGHT BAND</text>

  <!-- ASSET 01: input stack -->
  <g transform="translate(72 86)">
    <rect width="398" height="392" rx="28" fill="#E9F0F8" stroke="#C8D7E9"/>
    <text class="font sectionTitle" x="28" y="45">데이터 입력</text>
    <g transform="translate(28 73)" filter="url(#shadow)">
      <rect width="342" height="82" rx="18" fill="url(#cardFill)"/>
      <circle cx="42" cy="41" r="24" fill="#FFFFFF"/>
      <path d="M29 49 C54 22 72 58 91 30" stroke="#657188" stroke-width="5" stroke-linecap="round"/>
      <circle cx="29" cy="49" r="4" fill="#0B63F6"/>
      <circle cx="91" cy="30" r="4" fill="#FF8B3D"/>
      <text class="font cardTitle" x="86" y="35">GPS 주행 로그</text>
      <text class="font cardText" x="86" y="59">출발·도착 좌표 / 거리 / 시간</text>
    </g>
    <g transform="translate(28 169)" filter="url(#shadow)">
      <rect width="342" height="82" rx="18" fill="url(#cardFill)"/>
      <circle cx="42" cy="41" r="24" fill="#FFFFFF"/>
      <path d="M26 49 H58" stroke="#657188" stroke-width="5" stroke-linecap="round"/>
      <path d="M34 35 H67" stroke="#657188" stroke-width="5" stroke-linecap="round"/>
      <path d="M50 23 H78" stroke="#657188" stroke-width="5" stroke-linecap="round"/>
      <text class="font cardTitle" x="86" y="35">eTAS 위험운전 기준</text>
      <text class="font cardText" x="86" y="59">과속·급가속·급감속 판정</text>
    </g>
    <g transform="translate(28 265)" filter="url(#shadow)">
      <rect width="342" height="82" rx="18" fill="url(#cardFill)"/>
      <circle cx="42" cy="41" r="24" fill="#FFFFFF"/>
      <rect x="25" y="25" width="34" height="34" rx="6" stroke="#657188" stroke-width="5"/>
      <path d="M69 29 V58 M80 35 V58 M91 23 V58" stroke="#657188" stroke-width="5" stroke-linecap="round"/>
      <text class="font cardTitle" x="86" y="35">TAAS 사고통계</text>
      <text class="font cardText" x="86" y="59">위험행동별 공공 가중치</text>
    </g>
  </g>

  <!-- ASSET 02: simulation hub -->
  <g transform="translate(560 86)">
    <rect width="500" height="392" rx="30" fill="#E9F0F8" stroke="#C8D7E9"/>
    <text class="font sectionTitle" x="44" y="45">Agent-in-the-loop 시뮬레이션</text>
    <g transform="translate(64 72)">
      <circle cx="186" cy="158" r="142" fill="url(#hubFill)" stroke="#C9D8EB" stroke-width="2" filter="url(#softShadow)"/>
      <circle cx="186" cy="158" r="106" fill="none" stroke="#8FA5C1" stroke-width="14" opacity="0.34"/>
      <circle cx="186" cy="158" r="72" fill="#FFFFFF" stroke="#0B63F6" stroke-width="5"/>
      <circle cx="186" cy="158" r="40" fill="#111D3A"/>
      <path d="M171 158 H201 M186 143 V173" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <text class="font white" x="186" y="226" text-anchor="middle" style="font-size:17px;font-weight:900;">AI Simulation Engine</text>
      <path d="M74 110 C126 52 219 41 291 100" stroke="#0B63F6" stroke-width="4" stroke-dasharray="10 9" opacity="0.72"/>
      <path d="M70 208 C145 277 244 265 304 203" stroke="#FF8B3D" stroke-width="4" stroke-dasharray="10 9" opacity="0.75"/>
      <g>
        <circle cx="82" cy="93" r="17" fill="#FFFFFF" stroke="#0B63F6" stroke-width="3"/>
        <circle cx="305" cy="104" r="17" fill="#FFFFFF" stroke="#0B63F6" stroke-width="3"/>
        <circle cx="84" cy="229" r="17" fill="#FFFFFF" stroke="#FF8B3D" stroke-width="3"/>
        <circle cx="294" cy="230" r="17" fill="#FFFFFF" stroke="#FF8B3D" stroke-width="3"/>
        <path d="M74 97 C82 85 90 97 82 104 C74 97 90 97 82 104" fill="#8FA5C1"/>
        <path d="M297 108 C305 96 313 108 305 115 C297 108 313 108 305 115" fill="#8FA5C1"/>
        <path d="M76 233 C84 221 92 233 84 240 C76 233 92 233 84 240" fill="#8FA5C1"/>
        <path d="M286 234 C294 222 302 234 294 241 C286 234 302 234 294 241" fill="#8FA5C1"/>
      </g>
    </g>
    <g class="font small navy">
      <rect x="38" y="326" width="94" height="32" rx="16" fill="#FFFFFF" stroke="#C9D8EB"/>
      <text x="85" y="347" text-anchor="middle">6종 페르소나</text>
      <rect x="145" y="326" width="102" height="32" rx="16" fill="#FFFFFF" stroke="#C9D8EB"/>
      <text x="196" y="347" text-anchor="middle">14개월 주행</text>
      <rect x="260" y="326" width="106" height="32" rx="16" fill="#FFFFFF" stroke="#C9D8EB"/>
      <text x="313" y="347" text-anchor="middle">후보 산식 비교</text>
      <rect x="379" y="326" width="80" height="32" rx="16" fill="#111D3A"/>
      <text class="white" x="419" y="347" text-anchor="middle">A/B Test</text>
    </g>
  </g>

  <!-- ASSET 03: output stack -->
  <g transform="translate(1130 86)">
    <rect width="398" height="392" rx="28" fill="#E9F0F8" stroke="#C8D7E9"/>
    <text class="font sectionTitle" x="28" y="45">AI 산출물</text>
    <g transform="translate(28 73)" filter="url(#shadow)">
      <rect width="342" height="82" rx="18" fill="url(#cardFill)"/>
      <circle cx="42" cy="41" r="24" fill="#FFFFFF"/>
      <circle cx="42" cy="41" r="18" fill="none" stroke="#657188" stroke-width="4"/>
      <circle cx="42" cy="41" r="7" fill="#0B63F6"/>
      <text class="font cardTitle" x="86" y="35">생활권 생성</text>
      <text class="font cardText" x="86" y="59">DBSCAN + P90 Buffer</text>
    </g>
    <g transform="translate(28 169)" filter="url(#shadow)">
      <rect width="342" height="82" rx="18" fill="url(#cardFill)"/>
      <circle cx="42" cy="41" r="24" fill="#FFFFFF"/>
      <path d="M24 55 C39 31 54 59 70 27" stroke="#657188" stroke-width="5" stroke-linecap="round"/>
      <circle cx="70" cy="27" r="5" fill="#FF8B3D"/>
      <text class="font cardTitle" x="86" y="35">위험변화 점수</text>
      <text class="font cardText" x="86" y="59">평소 대비 외부·야간·급감속 변화</text>
    </g>
    <g transform="translate(28 265)" filter="url(#shadow)">
      <rect width="342" height="82" rx="18" fill="url(#cardFill)"/>
      <circle cx="42" cy="41" r="24" fill="#FFFFFF"/>
      <path d="M29 24 H53 L65 36 V59 H29 Z" stroke="#657188" stroke-width="4" stroke-linejoin="round"/>
      <path d="M53 24 V36 H65" stroke="#657188" stroke-width="4"/>
      <path d="M36 49 H56" stroke="#657188" stroke-width="4" stroke-linecap="round"/>
      <text class="font cardTitle" x="86" y="35">XAI 리포트</text>
      <text class="font cardText" x="86" y="59">Reason Code → 직원용 설명문</text>
    </g>
  </g>

  <!-- ASSET 04: pipeline strip -->
  <g transform="translate(152 574)">
    <rect width="1296" height="122" rx="31" fill="#E9F0F8" stroke="#C8D7E9"/>
    <g transform="translate(78 45)">
      <rect width="150" height="40" rx="20" fill="#FFFFFF" stroke="#C9D8EB"/>
      <text class="font pillText navy" x="75" y="26" text-anchor="middle">주행 로그</text>
      <path d="M167 20 H205" stroke="#7B8CA8" stroke-width="4" stroke-linecap="round"/>
      <path d="M205 20 L194 10 M205 20 L194 30" stroke="#7B8CA8" stroke-width="4" stroke-linecap="round"/>
      <rect x="228" width="160" height="40" rx="20" fill="#FFFFFF" stroke="#C9D8EB"/>
      <text class="font pillText navy" x="308" y="26" text-anchor="middle">생활권 생성</text>
      <path d="M405 20 H443" stroke="#7B8CA8" stroke-width="4" stroke-linecap="round"/>
      <path d="M443 20 L432 10 M443 20 L432 30" stroke="#7B8CA8" stroke-width="4" stroke-linecap="round"/>
      <rect x="466" width="160" height="40" rx="20" fill="#FFFFFF" stroke="#C9D8EB"/>
      <text class="font pillText navy" x="546" y="26" text-anchor="middle">Agent 검증</text>
      <path d="M643 20 H681" stroke="#7B8CA8" stroke-width="4" stroke-linecap="round"/>
      <path d="M681 20 L670 10 M681 20 L670 30" stroke="#7B8CA8" stroke-width="4" stroke-linecap="round"/>
      <rect x="704" width="178" height="40" rx="20" fill="#FFFFFF" stroke="#C9D8EB"/>
      <text class="font pillText navy" x="793" y="26" text-anchor="middle">연간 통합점수</text>
      <path d="M899 20 H937" stroke="#7B8CA8" stroke-width="4" stroke-linecap="round"/>
      <path d="M937 20 L926 10 M937 20 L926 30" stroke="#7B8CA8" stroke-width="4" stroke-linecap="round"/>
      <rect x="960" width="210" height="40" rx="20" fill="#111D3A"/>
      <text class="font pillText white" x="1065" y="26" text-anchor="middle">우대·기본·예방 케어</text>
    </g>
  </g>

  <!-- ASSET 05: insight band -->
  <g transform="translate(232 790)">
    <rect width="1136" height="112" rx="28" fill="#E9F0F8" stroke="#C8D7E9"/>
    <path d="M42 69 L64 31 L86 69 Z" fill="#111D3A"/>
    <rect x="61" y="47" width="6" height="13" rx="3" fill="#FFFFFF"/>
    <circle cx="64" cy="66" r="3" fill="#FFFFFF"/>
    <text class="font navy" x="114" y="57" style="font-size:25px;font-weight:900;letter-spacing:-0.7px;">AI는 보험료를 직접 결정하지 않고,</text>
    <text class="font orange" x="548" y="57" style="font-size:25px;font-weight:900;letter-spacing:-0.7px;">연간 판단 근거와 예방 케어 신호</text>
    <text class="font navy" x="940" y="57" style="font-size:25px;font-weight:900;letter-spacing:-0.7px;">를 제공합니다.</text>
    <text class="font muted" x="114" y="83" style="font-size:15px;font-weight:800;letter-spacing:-0.3px;">
      생활권 생성 · Agent 시뮬레이션 · XAI 리포팅으로 심사자가 납득 가능한 판단 흐름을 만듭니다.
    </text>
  </g>
</svg>
